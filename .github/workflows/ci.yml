name: CI
on:
  push:
    branches: [main, 'hermes/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Python security and data contracts
        run: PYTHONPATH=release python3 -m unittest discover -s . -p 'test_*.py'
      - name: JavaScript data and rendering contracts
        run: for f in test_*.mjs; do node "$f"; done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        run: npm run test:browser
      - name: Synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 2
